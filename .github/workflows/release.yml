name: Release

# Push a tag such as v0.1.0 to build installers and publish a release.
# The notes are docs/releases/<tag>.<locale>.md, one file per language (v0.3.0.zh-CN.md,
# v0.3.0.en.md); the app shows the one in its own language. Without them, the tag's message
# (git tag -a v0.2.0 -m "..."), or else the commits since the previous tag.
# If any platform fails, the release stays a draft.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - os: macos-15-intel
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - os: windows-latest
            args: ''
            target: ''
          - os: ubuntu-22.04
            args: ''
            target: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Discratcher ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Checkout flattens the pushed tag; fetch it again to read its message.
      - run: git fetch --force --tags origin
      - name: Publish with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          hint='macOS 版未签名，首次打开请右键选择“打开”。'
          # Each language's notes, by locale, from docs/releases/<tag>.<locale>.md.
          by='{}'
          for f in "docs/releases/$tag".*.md; do
            [ -e "$f" ] || continue
            code="${f#docs/releases/$tag.}"
            by="$(jq --arg c "${code%.md}" --rawfile n "$f" '. + {($c): $n}' <<<"$by")"
          done
          if [ "$by" != '{}' ]; then
            # Apps before per-language notes read the Chinese; the page shows every language.
            notes="$(jq -r '.["zh-CN"] // ([.[]] | first)' <<<"$by")"
            page="$(jq -r '[.["zh-CN"] // empty] + [to_entries[] | select(.key != "zh-CN") | .value] | join("\n\n---\n\n")' <<<"$by")"
          else
            if [ "$(git cat-file -t "$tag")" = tag ]; then
              notes="$(git tag -l --format='%(contents)' "$tag")"
            else
              prev="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
              notes="$(git log --pretty='- %s' "${prev:+$prev..}$tag")"
            fi
            page="$notes"
          fi
          printf '%s\n\n---\n\n%s\n' "$notes" "$hint" > notes.md
          printf '%s\n\n---\n\n%s\n' "$page" "$hint" > page.md
          gh release download "$tag" --pattern latest.json
          jq --rawfile notes notes.md --argjson by "$by" '.notes = $notes | if $by == {} then . else .notesByLocale = $by end' latest.json > notes.json
          mv notes.json latest.json
          gh release upload "$tag" latest.json --clobber
          gh release edit "$tag" --draft=false --latest --notes-file page.md
