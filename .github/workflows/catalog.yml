name: Catalog

# Publishes the library as files, so the app never spends GitHub API quota:
# a small search index, the geometry behind it, and one legacy file for old releases.
# Closed issues stay in the library: closing is what the bot does after publishing,
# and deleting an issue is what withdraws it.
on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: catalog
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'calibration') ||
      contains(github.event.issue.labels.*.name, 'rating') ||
      github.event.label.name == 'calibration' ||
      github.event.label.name == 'rating'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the catalog
        run: |
          mkdir site
          list() {
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues?labels=$1&state=all&per_page=100" |
              jq '[add // [] | .[] | select(.pull_request | not) | {number, body, labels: [.labels[] | {name}], user: {login: .user.login}}]'
          }
          list calibration > calibrations.json
          list rating > ratings.json
          # The app searches the index and fetches the geometry only to download a calibration.
          jq -n --slurpfile c calibrations.json --slurpfile r ratings.json -f .github/catalog.jq > library.json
          jq .index library.json > site/index.json
          jq .values library.json > site/values.json
          # Releases up to 0.1.4 read this one; keep publishing it until they are gone.
          jq -n --slurpfile c calibrations.json --slurpfile r ratings.json '{calibrations: $c[0], ratings: $r[0]}' > site/catalog.json
      - name: Publish to the catalog branch
        working-directory: site
        run: |
          git init -q -b catalog
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json values.json catalog.json
          git commit -q -m "Update catalog"
          git push -q --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" catalog
      - name: Close the issue that was just published
        if: github.event_name == 'issues' && github.event.action != 'deleted' && github.event.issue.state == 'open'
        run: gh issue close "${{ github.event.issue.number }}" --reason completed
