[package]
name = "disc-core"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Spiral geometry, ISO carving and drive-timing calibration for DVD-R data-side imaging."
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
memmap2 = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Com", "Win32_System_Variant", "Win32_Security"] }

[build-dependencies]
cc = "1"