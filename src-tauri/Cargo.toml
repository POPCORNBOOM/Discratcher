[package]
name = "discratcher"
version = "0.1.1"
description = "DVD-R data-side carving and drive-timing calibration studio."
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "discratcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
disc-core = { path = "../crates/disc-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
